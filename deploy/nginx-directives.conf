# Plesk → Domains → <دامنه> → Apache & nginx Settings → Additional nginx directives
# (اسکریپت install.sh این فایل را خودکار در vhost_nginx.conf همین دامنه قرار می‌دهد.)
client_max_body_size 12m;

location /api/ {
    proxy_pass http://127.0.0.1:__PORT__;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 180s;
}

location /uploads/ {
    proxy_pass http://127.0.0.1:__PORT__;
    proxy_set_header Host $host;
    expires 7d;
}

# سرویس‌ورکر و manifest نباید کش شوند تا نسخه‌ی جدید فوراً برسد
location = /sw.js { add_header Cache-Control "no-cache"; try_files $uri =404; }
location = /index.html { add_header Cache-Control "no-cache"; try_files $uri =404; }

# مسیرهای SPA (React Router)
location / {
    try_files $uri $uri/ /index.html;
}
